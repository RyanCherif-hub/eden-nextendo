name: Build NHSE (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nhse.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get NHSE source
        shell: bash
        run: git clone --depth 1 https://github.com/kwsch/NHSE.git nhse

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        run: |
          cd nhse
          dotnet publish NHSE.WinForms/NHSE.WinForms.csproj -c Release -r win-x64 \
            --self-contained true -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -o ../out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NHSE-Windows
          path: out/*
          retention-days: 30
